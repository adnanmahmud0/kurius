services:
  kurius-postgres:
    image: postgres:16-alpine
    container_name: kurius_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kurius_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - kurius_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kurius_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kurius_pgdata:
    driver: local
