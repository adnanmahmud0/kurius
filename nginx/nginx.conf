# ─────────────────────────────────────────────────────────
#  Kurius Production — Nginx Reverse Proxy
#  Domain: kuriusapp.cloud
#  API:    127.0.0.1:5000  (Docker container)
#  Web:    127.0.0.1:3000  (Docker container)
#
#  NOTE: Certbot will automatically add the HTTPS server
#        block below when SSL is first obtained.
# ─────────────────────────────────────────────────────────

# Rate limiting zone for API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ─────────────────────────────────────────────────────────
#  api.kuriusapp.cloud — HTTP → force HTTPS redirect
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.kuriusapp.cloud;

    # Force all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────
#  api.kuriusapp.cloud — HTTPS → Express API (port 5000)
#  (Certbot will populate ssl_certificate lines below)
# ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.kuriusapp.cloud;

    # Certbot manages these certificate paths
    ssl_certificate /etc/letsencrypt/live/kuriusapp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuriusapp.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/javascript;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ─────────────────────────────────────────────────────────
#  kuriusapp.cloud / www.kuriusapp.cloud → Next.js + API
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kuriusapp.cloud www.kuriusapp.cloud;

    # Max upload size (for file uploads)
    client_max_body_size 500M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ── API routes ──────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # ── Swagger/API Docs ────────────────────────────────
    location /api-docs {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js Web App (catch-all) ─────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
