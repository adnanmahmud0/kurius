# ─────────────────────────────────────────────────────────
#  Kurius Production — Nginx Reverse Proxy
#  Domains:
#    - admin.kuriusapp.cloud → Next.js Admin Dashboard (/apps/web, Port 3000)
#    - api.kuriusapp.cloud   → Express Backend API (/apps/api, Port 5000)
#    - kuriusapp.cloud       → Main Domain (Reserved, No Page / 404)
# ─────────────────────────────────────────────────────────

# Rate limiting zone for API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ─────────────────────────────────────────────────────────
#  1. api.kuriusapp.cloud — HTTP → force HTTPS redirect
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.kuriusapp.cloud;

    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────
#  2. api.kuriusapp.cloud — HTTPS → Express API (/apps/api, Port 5000)
# ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.kuriusapp.cloud;

    ssl_certificate /etc/letsencrypt/live/kuriusapp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuriusapp.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/javascript;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ─────────────────────────────────────────────────────────
#  3. admin.kuriusapp.cloud — HTTP → force HTTPS redirect
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.kuriusapp.cloud;

    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────
#  4. admin.kuriusapp.cloud — HTTPS → Next.js Admin Dashboard (/apps/web, Port 3000)
# ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.kuriusapp.cloud;

    ssl_certificate /etc/letsencrypt/live/kuriusapp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuriusapp.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ── Proxy /api/ requests from admin dashboard directly to backend ──
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # ── Next.js Admin Dashboard UI ──────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ─────────────────────────────────────────────────────────
#  5. kuriusapp.cloud / www.kuriusapp.cloud — Main Domain (Reserved - No App Connected)
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kuriusapp.cloud www.kuriusapp.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kuriusapp.cloud www.kuriusapp.cloud;

    ssl_certificate /etc/letsencrypt/live/kuriusapp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuriusapp.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No web/api app is connected to the main root domain
    location / {
        default_type text/html;
        return 404 "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>Kurius</title><style>body{background:#0b0f19;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}h1{font-size:2rem;margin-bottom:8px;}p{color:#94a3b8;}</style></head><body><div style='text-align:center;'><h1>Kurius</h1><p>Main website is currently under development.</p></div></body></html>\n";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
