# ─────────────────────────────────────────────────────────
#  Kurius Production — Nginx Reverse Proxy
#  Domains:
#    - api.kuriusapp.cloud   → Express Backend (Port 5000)
#    - admin.kuriusapp.cloud → Next.js Admin Dashboard (Port 3000)
#    - kuriusapp.cloud       → Main Domain (Redirects to Admin for now)
# ─────────────────────────────────────────────────────────

# Rate limiting zone for API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ─────────────────────────────────────────────────────────
#  1. api.kuriusapp.cloud — HTTP → force HTTPS redirect
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.kuriusapp.cloud;

    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────
#  2. api.kuriusapp.cloud — HTTPS → Express API (port 5000)
# ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.kuriusapp.cloud;

    ssl_certificate /etc/letsencrypt/live/kuriusapp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuriusapp.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/javascript;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ─────────────────────────────────────────────────────────
#  3. admin.kuriusapp.cloud — HTTP → force HTTPS redirect
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.kuriusapp.cloud;

    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────
#  4. admin.kuriusapp.cloud — HTTPS → Next.js Admin (port 3000)
# ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.kuriusapp.cloud;

    ssl_certificate /etc/letsencrypt/live/kuriusapp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuriusapp.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ── Proxy /api/ requests from admin dashboard directly to backend ──
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # ── Next.js Admin Dashboard UI ──────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ─────────────────────────────────────────────────────────
#  5. kuriusapp.cloud / www.kuriusapp.cloud — Main Domain
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kuriusapp.cloud www.kuriusapp.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kuriusapp.cloud www.kuriusapp.cloud;

    ssl_certificate /etc/letsencrypt/live/kuriusapp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuriusapp.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # For now, forward to admin dashboard (or can be swapped later when main website is created)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
