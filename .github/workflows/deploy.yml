name: 🚀 Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Type-check the monorepo before build
  # ─────────────────────────────────────────────
  typecheck:
    name: ✅ Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client (required for TypeScript types)
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"

      - name: Run type check
        run: npx turbo typecheck

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push Lean Docker Images (GHCR)
  # ─────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Images (Cloud)
    needs: typecheck
    runs-on: ubuntu-latest
    outputs:
      repo_owner: ${{ steps.repo_owner.outputs.owner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image (Multi-stage Slim)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/kurius-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image (Next.js Standalone)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/kurius-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 3: Deploy Pre-built Images to VPS via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy Pre-built Containers to Hostinger VPS
    needs: [typecheck, build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV: |
            NODE_ENV=production
            PORT=5000
            IP_ADDRESS=0.0.0.0
            ENABLE_API_DOCS=true
            BCRYPT_SALT_ROUNDS=10
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRE_IN=${{ secrets.JWT_EXPIRE_IN }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRE_IN=${{ secrets.JWT_REFRESH_EXPIRE_IN }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            POSTGRES_USER=postgres
            POSTGRES_DB=kurius_db
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            GH_REPOSITORY_OWNER=${{ needs.build-and-push.outputs.repo_owner }}
          GH_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_OWNER_LOWER: ${{ needs.build-and-push.outputs.repo_owner }}
          GH_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_ENV,GH_DEPLOY_TOKEN,GH_ACTOR,GH_OWNER_LOWER,GH_REPOSITORY
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo " [1/7] Disk space cleanup & swap removal"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Reclaim 2GB swap space since compilation happens in GitHub Cloud
            if [ -f /swapfile ]; then
              echo "Reclaiming 2GB swap file..."
              swapoff /swapfile 2>/dev/null || true
              rm -f /swapfile
              sed -i '/swapfile/d' /etc/fstab || true
              echo "✓ 2GB swap space reclaimed"
            fi

            apt-get update -qq

            # Ensure Docker is installed
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
            fi

            # Ensure Nginx & Certbot are installed
            if ! command -v nginx &> /dev/null; then
              apt-get install -y -qq nginx
              systemctl enable nginx
              systemctl start nginx
            fi
            if ! command -v certbot &> /dev/null; then
              apt-get install -y -qq certbot python3-certbot-nginx
            fi
            if ! command -v git &> /dev/null; then
              apt-get install -y -qq git
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo " [2/7] Setup deployment directory"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            REPO_DIR="/opt/kurius"
            REPO_URL="https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/${GH_REPOSITORY}.git"

            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone --depth 1 "$REPO_URL" "$REPO_DIR"
            else
              cd "$REPO_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch --depth 1 origin main
              git reset --hard origin/main
            fi

            cd "$REPO_DIR"

            # Write .env safely from secrets
            printf '%s\n' "$DEPLOY_ENV" > .env
            echo "✓ .env written"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo " [3/7] Pull pre-built images from GHCR"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Authenticate with GitHub Container Registry
            echo "$GH_DEPLOY_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Pull pre-compiled images (no building on VPS!)
            GH_REPOSITORY_OWNER="$GH_OWNER_LOWER" docker compose -f docker-compose.prod.yml pull
            echo "✓ Pre-built images pulled"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo " [4/7] Start containers with pre-built images"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            GH_REPOSITORY_OWNER="$GH_OWNER_LOWER" docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "✓ Containers started"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo " [5/7] Wait for services & database health"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            for i in $(seq 1 30); do
              if docker exec kurius_prod_postgres pg_isready -U postgres -d kurius_db -q; then
                echo "✓ PostgreSQL is ready"
                break
              fi
              echo "  Waiting for database... ($i/30)"
              sleep 2
            done

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo " [6/7] Configure Nginx & SSL"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            certbot certonly --nginx \
              --force-renewal \
              --cert-name kuriusapp.cloud \
              -d kuriusapp.cloud \
              -d www.kuriusapp.cloud \
              -d api.kuriusapp.cloud \
              -d admin.kuriusapp.cloud \
              --non-interactive \
              --agree-tos \
              --email ${{ secrets.EMAIL_USER }} || true

            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            cp "$REPO_DIR/nginx/nginx.conf" /etc/nginx/sites-available/kurius
            ln -sf /etc/nginx/sites-available/kurius /etc/nginx/sites-enabled/kurius
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx
            echo "✓ Nginx reloaded"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo " [7/7] Deep disk cleanup (Reclaim all unused space)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Remove all dangling/old images & containers (preserves active volumes & running containers)
            docker system prune -af --volumes=false || true
            docker builder prune -af || true
            apt-get clean || true
            journalctl --vacuum-size=20M || true

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✅  DEPLOYMENT COMPLETE!"
            echo "  🌐  https://admin.kuriusapp.cloud"
            echo "  💾  Disk Usage Summary:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            df -h /
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
